[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cursorsnapshot"
version = "0.1.0"
description = "Durable bounded SQLite export snapshots with bound signed pagination"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "lllleolin-max"}]
dependencies = []

[project.scripts]
cursorsnapshot = "cursorsnapshot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
